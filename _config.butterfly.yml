# --------------------------------------
# Butterfly 主题配置（覆盖 themes/butterfly/_config.yml 的默认值）
# 视觉部分几乎全部由 source/css/custom.css 重写，这里只管结构和功能
# 完整选项说明: https://butterfly.js.org/
# --------------------------------------

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user

# 全站不要大图 banner，直接进内容（参考站就是这样）
# 封面图仍然会在首页卡片流里作为缩略图出现，只是不再铺成顶部大图
disable_top_img: true

# 首页文章排版：封面与信息左右交替
index_layout: 3

# 自动摘要，控制在两三行，卡片流才好看
index_post_content:
  method: 3
  length: 120

subtitle:
  enable: false

# 侧栏头像（不设的话会用主题自带的蝴蝶图标）
avatar:
  img: https://raw.githubusercontent.com/EnterSuper/blog_picture/main/头像.jpg
  effect: false

aside:
  enable: true
  position: right
  card_author:
    enable: true
    description: 论文精读与学习笔记
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/EnterSuper
  card_announcement:
    enable: false
  card_recent_post:
    enable: true
    limit: 5
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: true
    limit: 30
    orderby: name
    order: 1
  card_archives:
    enable: true
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    # 不蒜子的全站访客/访问量是共享计数，数字大到没有意义，关掉
    site_uv: false
    site_pv: false

# 文章页也不显示页面浏览量
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

code_blocks:
  theme: light
  macStyle: false
  copy: true

search:
  use: local_search
  local_search:
    preload: true

share:
  use:

comments:
  use:

math:
  use: katex
  per_page: true
  katex:
    copy_tex: true

# 整站视觉重写
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/js/es-layout.js"></script>
